# ASP.NET Core (.NET Framework)
# Build and test ASP.NET Core projects targeting the full .NET Framework.
# Add steps that publish symbols, save build artifacts, and more:
# https://docs.microsoft.com/azure/devops/pipelines/languages/dotnet-core

trigger:
  paths:
    include:
    - ParkPal.NotificationService/*

pool:
  name: 'Linux Pool'


variables:
  buildPlatform: 'Any CPU'
  buildConfiguration: 'Release'

steps:

- task: DownloadPipelineArtifact@2
  inputs:
    buildType: 'current'
    targetPath: '$(Pipeline.Workspace)'

- task: NuGetToolInstaller@1

- task: DotNetCoreCLI@2
  inputs:
    command: 'build'
    projects: '$(Build.SourcesDirectory)/ParkPal.NotificationService/ParkPal.NotificationService.sln'

- task: CopyFiles@2
  inputs:
    SourceFolder: '$(Build.SourcesDirectory)/ParkPal.NotificationService/ParkPal.NotificationService/bin/Release/net6.0/linux-x64/'
    Contents: '**'
    TargetFolder: '/staging/'
    OverWrite: true
    CleanTargetFolder: true