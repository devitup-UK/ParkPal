# ASP.NET Core (.NET Framework)
# Build and test ASP.NET Core projects targeting the full .NET Framework.
# Add steps that publish symbols, save build artifacts, and more:
# https://docs.microsoft.com/azure/devops/pipelines/languages/dotnet-core

trigger:
  paths:
    include:
    - ParkPal.API/*

pool:
  name: 'Windows Pool'


variables:
  buildPlatform: 'Any CPU'
  buildConfiguration: 'Release'

steps:

- task: DownloadPipelineArtifact@2
  inputs:
    buildType: 'current'
    targetPath: '$(Pipeline.Workspace)'

- task: NuGetToolInstaller@1

- task: UseDotNet@2
  inputs:
    packageType: 'sdk'
    version: '7.0.400'

- task: DotNetCoreCLI@2
  inputs:
    command: 'build'
    projects: '$(Build.SourcesDirectory)\ParkPal.API\ParkPal.API.sln'
    
- task: DotNetCoreCLI@2
  inputs:
    command: 'publish'
    arguments: '-c Release --sc'
    projects: '$(Build.SourcesDirectory)\ParkPal.API\ParkPal.API.sln'

- task: ExtractFiles@1
  inputs:
    archiveFilePatterns: '$(Build.SourcesDirectory)/ParkPal.API/ParkPal.API/bin/Release/**/**/publish.zip'
    destinationFolder: 'C:\staging\ParkPal.API\'
    cleanDestinationFolder: true
    overwriteExistingFiles: true