version: '3.8'

services:
  # 🐘 The PostgreSQL Database
  parkpal-db:
    image: postgres:15-alpine
    container_name: parkpal_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: parkpal_admin
      POSTGRES_PASSWORD: supersecretpassword
      POSTGRES_DB: parkpal_local
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U parkpal_admin -d parkpal_local"]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - parkpal_db_data:/var/lib/postgresql/data
    

  parkpal-db-deployer:
    container_name: parkpal_db_deployer
    build:
      context: .
      dockerfile: ParkPal.DatabaseDeployer/Dockerfile
    environment:
      - ConnectionStrings__DatabaseConnection=Host=parkpal-db;Username=parkpal_admin;Password=supersecretpassword;Database=parkpal_local
    depends_on:
      parkpal-db:
        condition: service_healthy # Waits for Postgres to be actually ready, not just turned on

  # 📊 pgAdmin (Web-based Database Viewer)
  pgadmin:
    image: dpage/pgadmin4
    container_name: parkpal_pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@parkpal.com
      PGADMIN_DEFAULT_PASSWORD: supersecretpassword
    ports:
      - "5050:80"
    depends_on:
      - parkpal-db

  # 🚀 Your C# API
  parkpal-api:
    container_name: parkpal_api
    build:
      context: . # ⭐️ Crucial: The build context is the ROOT of the repo so it can see ParkPal.Common
      dockerfile: ParkPal.API/Dockerfile
    ports:
      - "5001:8080" # Maps port 5001 on your Mac to port 8080 inside the .NET container
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
    volumes:
      # ⭐️ THE WORMHOLE: local-mac-path : inside-container-path
      - ./ParkPal.API/ParkPal.API/appsettings.Development.json:/app/appsettings.Development.json
    depends_on:
      parkpal-db-deployer:
        condition: service_completed_successfully # ⭐️ API waits for the deployer to finish and exit!

  # 📝 Seq (Centralized Logging)
  seq:
    image: datalust/seq:latest
    container_name: parkpal_seq
    restart: unless-stopped
    environment:
      - ACCEPT_EULA=Y
      - SEQ_FIRSTRUN_ADMINPASSWORD=SuperSecretPassword123!
    ports:
      - "8081:80"    # Maps port 8081 on your Mac to the Seq Dashboard UI
      - "5341:5341"  # The port your C# API will use to send logs

  parkpal-sync:
    container_name: parkpal_sync
    build:
      context: .
      dockerfile: ParkPal.SyncService/Dockerfile
    environment:
      - ASPNETCORE_ENVIRONMENT=Development 
    restart: unless-stopped
    depends_on:
      parkpal-db-deployer:
        condition: service_completed_successfully # ⭐️ API waits for the deployer to finish and exit!

  # 🚂 The Push Notification Engine
  parkpal-pushengine:
    container_name: parkpal_pushengine
    build:
      context: .
      dockerfile: ParkPal.PushEngine/Dockerfile
    environment:
      - ASPNETCORE_ENVIRONMENT=Development 
    restart: unless-stopped
    depends_on:
      parkpal-db-deployer:
        condition: service_completed_successfully

volumes:
  parkpal_db_data: