version: '3.8'

services:
  # 🐘 The PostgreSQL Database
  parkpal-db:
    image: postgres:15-alpine
    container_name: parkpal_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - parkpal_db_data:/var/lib/postgresql/data
    
  # 🏗️ The Database Deployer (Runs migrations then exits gracefully)
  parkpal-db-deployer:
    container_name: parkpal_db_deployer
    build:
      context: .
      dockerfile: ParkPal.DatabaseDeployer/Dockerfile
    environment:
      - ConnectionStrings__DatabaseConnection=Host=parkpal-db;Username=${DB_USER};Password=${DB_PASSWORD};Database=${DB_NAME}
    depends_on:
      parkpal-db:
        condition: service_healthy

  # 🚀 The Core C# API
  parkpal-api:
    container_name: parkpal_api
    build:
      context: .
      dockerfile: ParkPal.API/Dockerfile
    ports:
      - "5001:8080" 
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ConnectionStrings__DatabaseConnection=Host=parkpal-db;Username=${DB_USER};Password=${DB_PASSWORD};Database=${DB_NAME}
      - ConnectionStrings__LoggingConnection=http://seq:5341
      - Configuration__Secret=${JWT_SECRET}
      - Configuration__CdnBaseUrl=${CDN_BASE_URL}
    restart: unless-stopped
    depends_on:
      parkpal-db-deployer:
        condition: service_completed_successfully

  # 📝 Seq (Centralized Logging)
  seq:
    image: datalust/seq:latest
    container_name: parkpal_seq
    restart: unless-stopped
    environment:
      - ACCEPT_EULA=Y
      - SEQ_FIRSTRUN_ADMINPASSWORD=${SEQ_PASSWORD}
    ports:
      - "8081:80"    
      - "5341:5341"  

  # 🔄 The Sync Service
  parkpal-sync:
    container_name: parkpal_sync
    build:
      context: .
      dockerfile: ParkPal.SyncService/Dockerfile
    environment:
      - ASPNETCORE_ENVIRONMENT=Production 
      - ConnectionStrings__DatabaseConnection=Host=parkpal-db;Username=${DB_USER};Password=${DB_PASSWORD};Database=${DB_NAME}
      - ConnectionStrings__LoggingConnection=http://seq:5341
      - Configuration__Secret=${JWT_SECRET}
    restart: unless-stopped
    depends_on:
      parkpal-db-deployer:
        condition: service_completed_successfully 

  # 🚂 The Push Notification Engine
  parkpal-pushengine:
    container_name: parkpal_pushengine
    build:
      context: .
      dockerfile: ParkPal.PushEngine/Dockerfile
    environment:
      - ASPNETCORE_ENVIRONMENT=Production 
      - ConnectionStrings__DatabaseConnection=Host=parkpal-db;Username=${DB_USER};Password=${DB_PASSWORD};Database=${DB_NAME}
      - ConnectionStrings__LoggingConnection=http://seq:5341
      - ApplePush__P8PrivateKey=${APPLE_P8_KEY}
      - ApplePush__P8KeyId=${APPLE_KEY_ID}
      - ApplePush__TeamId=${APPLE_TEAM_ID}
      - ApplePush__UseProductionServers=true
    restart: unless-stopped
    depends_on:
      parkpal-db-deployer:
        condition: service_completed_successfully

  # 🛡️ Caddy Reverse Proxy (Handles SSL and Domain Routing)
  caddy:
    image: caddy:latest
    container_name: parkpal_caddy
    restart: unless-stopped
    ports:
      - "80:80"   # Standard HTTP
      - "443:443" # Secure HTTPS
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - parkpal-api

volumes:
  parkpal_db_data:
  caddy_data:
  caddy_config: